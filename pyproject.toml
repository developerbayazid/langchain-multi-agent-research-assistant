[project]
name = "langchain-multi-agent-research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "developerbayazid", email = "bayazid.freelancer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "readability-lxml>=0.9",
    "rich>=15.0.0",
    "streamlit>=1.66.1",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
]

[project.scripts]
langchain-multi-agent-research-assistant = "langchain_multi_agent_research_assistant:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
